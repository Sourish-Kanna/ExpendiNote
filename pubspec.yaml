name: expend_note
description: "An App to track daily spending and analyze it"
publish_to: 'none'
version: 2.0.4-dev

environment:
  sdk: ^3.14.0

dependencies:
  change_case: ^2.2.0
  csv: ^8.0.0
  cupertino_icons: ^2.0.0
  dynamic_color: ^2.1.0
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  intl: ^0.20.3
  logger: ^2.8.0
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqflite: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  launcher_name: ^1.0.2
  sqflite_common_ffi: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
   - assets/icon/

#  dart run launcher_name:main
launcher_name:
  default: "Expendi Note"

#  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  # Adaptive Icon Config (Android 8.0+)
  adaptive_icon_background: "#006A67" # Deep Material 3 Teal Background
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

  # Android 13+ Monochromatic/Themed Home Screen Icon Config
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  
# dart run change_app_package_name:main com.example.expend_note
# flutter pub add dev:change_app_package_name  