name: Build, Release, and Deploy

on:
  release:
    types: [released, prereleased]

permissions:
  contents: read

jobs:
  verify:
    name: Analyze & Test
    uses: ./.github/workflows/flutter-check.yml

  android-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # - name: Setup Java
      #   uses: actions/setup-java@v6
      #   with:
      #     distribution: microsoft
      #     java-version: '21'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          # flutter-version: 3.50.0
          flutter-version-file: pubspec.yaml

      - name: 🔐 Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks || { echo "::error::Keystore missing or empty"; exit 1; }

      - name: 📱 Build signed APK (arm64)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter build apk --split-per-abi --target-platform android-arm64 --release \
            --build-name "${TAG#v}" --build-number "${{ github.run_number }}"

      - name: ✏️ Rename APK
        run: |
          DIR=build/app/outputs/flutter-apk
          mv "$DIR/app-arm64-v8a-release.apk" "$DIR/Expendi-Note-${TAG}-arm64.apk"

      - name: 🚀 Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/Expendi-Note-*.apk
          fail_on_unmatched_files: true

  notify:
    needs: [verify, android-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📢 Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.android-release.result == 'success' && 'success' || (needs.android-release.result == 'cancelled' && 'cancelled' || 'failure') }}
          nodetail: true
          title: "Expendi Note ${{ github.event.release.tag_name }}"
          description: |
            **Android Build:** ${{ needs.android-release.result }}
            **Analyze & Test:** ${{ needs.verify.result }}

            [Download release](${{ github.event.release.html_url }})
            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: ${{ needs.android-release.result == 'success' && '0x2ecc71' || '0xe74c3c' }}
          url: ${{ github.event.release.html_url }}