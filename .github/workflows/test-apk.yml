name: Build Test APK

on:
  workflow_dispatch:

jobs:
  build-test-apk:
    name: Build Test APK
    runs-on: ubuntu-latest

    env:
      TEST_BUILD: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # - name: Setup Java
      #   uses: actions/setup-java@v6
      #   with:
      #     distribution: microsoft
      #     java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.50.0

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p build/test-apk
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/test-apk/ExpendiNote-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ExpendiNote-Test-APK
          path: build/test-apk/ExpendiNote-Test.apk
          if-no-files-found: error
          archive: false
