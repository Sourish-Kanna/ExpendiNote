name: Build Test APK

on:
  workflow_dispatch:

jobs:
  build-test-apk:
    name: Build Test APK
    runs-on: ubuntu-latest

    env:
      TEST_BUILD: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p build/test-apk
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/test-apk/ExpendiNote-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpendiNote-Test-APK
          path: build/test-apk/ExpendiNote-Test.apk
          if-no-files-found: error
