name: Build Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    name: Build Test APK
    runs-on: ubuntu-latest

    env:
      TEST_BUILD: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # - name: Setup Java
      #   uses: actions/setup-java@v6
      #   with:
      #     distribution: microsoft
      #     java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          # flutter-version: 3.50.0
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks || { echo "::error::Keystore missing or empty"; exit 1; }

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release --target-platform android-arm64 --build-number ${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p build/test-apk
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/test-apk/ExpendiNote-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ExpendiNote-Test-APK
          path: build/test-apk/ExpendiNote-Test.apk
          if-no-files-found: error
          archive: false
